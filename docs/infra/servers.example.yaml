# Server inventory for the Remote Ops agents.
#
# Each top-level key is a server NAME you refer to at run time
# (e.g. "diagnose prod-web"). The agent reads this file to resolve the
# connection details, then SSHes in.
#
# The PEM key must live ON THIS HOST (chmod 600) — only its PATH is stored here,
# never the key itself. Keep keys wherever you like (they do NOT have to be in
# ~/.ssh); a dedicated dir such as ~/keys/ is fine. Use an absolute path or ~.
#
# SSH is also gated per agent: only agents with "Allow remote login (SSH)" enabled
# can connect out at all, regardless of what's in this file.
#
# Copy the example block, rename it, and fill in real values. Delete the example.

example-web:
  host: 203.0.113.10           # public IP or DNS name
  user: ubuntu                 # SSH login user
  pem: ~/keys/example-web.pem  # path to the private key on THIS machine (chmod 600)
  notes: |
    Ubuntu 22.04. nginx (:80/:443) -> gunicorn (:8000). Logs in /var/log/nginx
    and journalctl -u myapp. Non-root sudo available.

# prod-web:
#   host: 1.2.3.4
#   user: ubuntu
#   pem: /Users/you/keys/prod-web.pem
#   notes: production web tier
