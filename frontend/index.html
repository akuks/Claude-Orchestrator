<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Orchestrator</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23f59e0b'/%3E%3Cstop offset='.5' stop-color='%23f97316'/%3E%3Cstop offset='1' stop-color='%23e11d48'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ccircle cx='21' cy='11' r='4' fill='%23fff'/%3E%3Cpath d='M6 25 Q12 16 19 12.5' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round' opacity='.85'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved mode before first paint (ThemeModeProvider takes over after).
      try {
        if (localStorage.getItem('co.mode') === 'night') document.documentElement.dataset.mode = 'night'
      } catch (e) {}
    </script>
    <style>
      html { --co-bg-solid: #fffaf6; --co-bg: linear-gradient(180deg,#ffffff,#fff7f0 60%,#fff4f6); }
      html[data-mode='night'] { --co-bg-solid: #0f0a14; --co-bg: linear-gradient(180deg,#0f0a14,#1a0f1f); }
      html { background-color: var(--co-bg-solid); background-image: var(--co-bg); background-attachment: fixed; }
      body { background: transparent; margin: 0; min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
